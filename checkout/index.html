<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Secure Checkout | Armonisse</title>

<script src="https://cdn.paddle.com/paddle/v2/paddle.js"></script>

<style>
body{
  margin:0;
  background:#f7f5f1;
  font-family:Arial,sans-serif;
  color:#1d1d1d;
}
  .checkout-logo{
  width:180px;
  height:auto;
  display:block;
  margin:0 0 18px 0;
}
.wrap{
  max-width:560px;
  margin:35px auto;
  padding:20px;
}
.summary{
  background:#fff;
  border:1px solid #e4e0d8;
  border-radius:12px;
  padding:22px;
  margin-bottom:18px;
}
.brand{
  font-size:13px;
  letter-spacing:1.5px;
  text-transform:uppercase;
  color:#777;
  margin-bottom:14px;
}
.product{
  font-size:22px;
  font-weight:700;
  margin-bottom:8px;
}
.price{
  font-size:25px;
  font-weight:700;
  margin-bottom:14px;
}
.secure{
  font-size:13px;
  color:#666;
}
.checkout-container{
  width:100%;
}
#error{
  text-align:center;
  padding:30px;
}
</style>
</head>

<body>

<div class="wrap">

  <div id="summary" class="summary" style="display:none">
    <img src="/assets/images/logo_checkout.png" alt="Herhenbar Premium" class="checkout-logo">
    <div class="brand">HERHENBAR PREMIUM · ARMONISSE</div>
    <div id="productName" class="product"></div>
    <div id="productPrice" class="price"></div>
    <div class="secure">Secure checkout powered by Paddle</div>
  </div>

  <div id="error"></div>
  <div class="checkout-container"></div>

</div>

<script>

const products = {
  "pri_01m7bmgm6rf0xqyew4rsq37phr": {
  name: "Dani Teste",
  price: "US$0.70"
},

"pri_01m5gj1jbm7rhsf75r52tkp16w":{
  name:"Brazilian Dessert Obsessions",
  price:"US$8.99"
},

"pri_01m5jq6w2wk4b9evvwfvq25xce":{
  name:"Brazil's Golden Crunch",
  price:"US$11.99"
},

"pri_01m5jpygc9tw147ren7b2q84cq":{
  name:"Must-Have Classics",
  price:"US$11.99"
},

"pri_01m5jq3dkbw6ayk81bqjxwy362":{
  name:"5 Hidden Gems",
  price:"US$12.99"
},

"pri_01m5jqae7cn8m1peybexg0sj71":{
  name:"Sea Delight",
  price:"US$9.99"
},

"pri_01m5j7sekem0dk23m79z8ycbm1":{
  name:"Luxury Teas",
  price:"US$10.99"
},

"pri_01m5jqe6ervtsmbv2nsd5rvj3m":{
  name:"Wine Euphoria Bundle",
  price:"US$17.99"
}

};

const params = new URLSearchParams(window.location.search);
const priceId = params.get("price");
const product = products[priceId];

  if (priceId === "pri_01m7bmgm6rf0xqyew4rsq37phr") {
  const logo = document.querySelector(".checkout-logo");
  const logoWrap = document.querySelector(".logo-wrap");
  const brand = document.querySelector(".brand");

  if (logo) logo.style.display = "none";
  if (logoWrap) logoWrap.style.display = "none";
  if (brand) brand.style.display = "none";
}

if(!product){

  document.getElementById("error").textContent =
  "Invalid checkout link.";

}else{

  document.getElementById("summary").style.display="block";
  document.getElementById("productName").textContent=product.name;
  document.getElementById("productPrice").textContent=product.price;

Paddle.Initialize({
  token: "live_bcc02f10637482dd1f0c1021927",

  eventCallback: function(event) {
    if (
      event.name === "checkout.completed" &&
      event.data?.transaction_id
    ) {
      window.location.href =
        "https://armonisse-fulfillment.henriqueman.workers.dev/download?txn=" +
        encodeURIComponent(event.data.transaction_id);
    }
  }
});

  Paddle.Checkout.open({

    items:[
      {
        priceId:priceId,
        quantity:1
      }
    ],

    settings:{
      displayMode:"inline",
      variant:"express",
      theme:"light",
      locale:"en",
      frameTarget:"checkout-container",
      frameInitialHeight:450,
      frameStyle:"width:100%;min-width:312px;background-color:transparent;border:none;"
    }

  });

}

</script>

</body>
</html>
